dagster-user-deployments:
  enabled: true
  deployments:
    - name: lab
      image:
        repository: platform-lab
        tag: dev
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs: ["-f", "/app/lab_defs.py"]
      port: 3030
      includeConfigInLaunchedRuns:
        enabled: true
      env:
        - name: LAB_S3_ENDPOINT
          value: http://s3:8333
        - name: LAB_S3_BUCKET
          value: dagster
        - name: AWS_REGION
          value: us-east-1
      envSecrets:
        - name: lab-s3
runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      imagePullPolicy: IfNotPresent
      envVars: ["LAB_ON_K8S=true"]
postgresql:
  enabled: true
